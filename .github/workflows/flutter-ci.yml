name: CI

on:
  push:
    branches: [ "main", "rebrand/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libhidapi-dev libhidapi-hidraw0 libhidapi-libusb0 libfuse2t64 wget

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Fetch appimagetool
        run: |
          wget -q -O "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Package AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
        run: ./linux/packaging/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardStudio-x86_64-AppImage
          path: |
            dist/KeyboardStudio-x86_64.AppImage
            dist/SHA256SUMS
            dist/99-keyboard-studio-mk1300.rules
